# Runs only the RCA platform API. Telemetry backends are external and are
# referenced through environment variables / YAML configuration.
services:
  rca-api:
    build: .
    image: evidence-grounded-rca:0.1.0
    ports:
      - "${RCA_API_PORT:-8000}:8000"
    env_file:
      - path: .env
        required: false
    environment:
      RCA_LOG_FORMAT: ${RCA_LOG_FORMAT:-json}
    volumes:
      - ./config:/app/config:ro   # edit YAML without rebuilding the image
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
